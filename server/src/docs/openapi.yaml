openapi: 3.0.3
info:
  title: WombTo18 CHIP API
  version: 0.1.0
  description: |
    Routes that exist on this server. Planned mother, child, and ABDM routes are not listed until they are implemented.
    Express paths do not include an /api prefix. The Vite dev server strips /api before proxying.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: staff@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Staff password. Not shown in examples.
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT. Not included as an example value.
        expiresIn:
          type: string
          example: 15m
        user:
          $ref: "#/components/schemas/StaffUser"
      description: The refresh token is set only as the httpOnly cookie chip_refresh. It is not a response field.
    SessionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        accessTtl:
          type: string
          example: 15m
    EnrolmentOtpRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        aadhaar:
          type: string
          description: 12-digit Aadhaar for the first send. Never logged or stored.
          example: "000000000000"
        consentAccepted:
          type: boolean
          enum: [true]
          description: Required on the first send, after the consent screen.
        resend:
          type: boolean
          description: True when resending an OTP for an existing transaction.
        transactionId:
          type: string
          format: uuid
          description: Required when resend is true.
        channel:
          type: string
          enum: [aadhaar, mobile]
          description: Required when resend is true.
    EnrolmentVerifyRequest:
      type: object
      required: [transactionId, otp, mobile, consentAccepted]
      properties:
        transactionId:
          type: string
          format: uuid
        otp:
          type: string
          description: Six-digit OTP. Never logged or stored.
          example: "000000"
        mobile:
          type: string
          description: Required 10-digit communication mobile. Sent with enrolment and shown on the result.
        consentAccepted:
          type: boolean
          enum: [true]
    MobileVerifyRequest:
      type: object
      required: [transactionId, otp]
      properties:
        transactionId:
          type: string
          format: uuid
        otp:
          type: string
    CreateAddressRequest:
      type: object
      required: [transactionId, abhaAddress]
      properties:
        transactionId:
          type: string
          format: uuid
        abhaAddress:
          type: string
          example: demo.mother@sbx
        useExisting:
          type: boolean
          description: Keep an address ABDM already holds, without another create call.
    AbhaIdentityView:
      type: object
      properties:
        verificationStatus:
          type: string
        abhaNumberMasked:
          type: string
          nullable: true
          example: "**-****-****-1234"
        abhaAddress:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    ManagedByStaff:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
    CreatePatientRequest:
      type: object
      required: [patientType, name, gender]
      properties:
        patientType:
          type: string
          enum: [MOTHER, CHILD, GENERAL]
        name:
          type: string
          example: Asha Devi
        gender:
          type: string
          enum: [M, F, O]
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Required when patientType is CHILD. Child must be under 18 years old.
        mobile:
          type: string
          description: Optional 10-digit mobile. Only last 4 digits are stored.
          example: "9876543210"
        forceNew:
          type: boolean
          description: Register a new patient even when name, gender, date of birth, and mobile last 4 match an existing record.
    PatientView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientType:
          type: string
          enum: [MOTHER, CHILD, GENERAL]
        name:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        mobileLast4:
          type: string
          nullable: true
        facilityId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        managedBy:
          $ref: "#/components/schemas/ManagedByStaff"
        abha:
          $ref: "#/components/schemas/AbhaIdentityView"
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: patient.create
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          nullable: true
        facilityId:
          type: string
          format: uuid
          nullable: true
        outcome:
          type: string
          enum: [success, denied, failure]
        message:
          type: string
          example: Registered CHILD patient Ravi Kumar (managed by Demo Staff).
        correlationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ManagedByStaff"
    AbdmTraceEntry:
      type: object
      description: Development trace of one ABHA call. Aadhaar, OTP, tokens, and login identifiers are replaced with [REDACTED].
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          example: POST
        path:
          type: string
          example: /abha/api/v3/enrollment/request/otp
        requestId:
          type: string
        status:
          type: integer
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        requestBody:
          nullable: true
        responseBody:
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Database liveness check
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                required: [success, message, database]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: OK
                  database:
                    type: string
                    example: up
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: DATABASE_UNAVAILABLE
                message: Database is unreachable
  /auth/login:
    post:
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token, staff profile, and an httpOnly refresh cookie
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/LoginData"
        "400":
          description: Email or password failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "body.email: Invalid email"
        "401":
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Invalid email or password
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: RATE_LIMITED
                message: Too many attempts. Try again later.
  /auth/refresh:
    post:
      summary: Issue a new staff access token
      parameters:
        - in: cookie
          name: chip_refresh
          required: true
          schema:
            type: string
          description: HttpOnly refresh cookie from login. The value is never returned in JSON.
      responses:
        "200":
          description: New access token. The refresh cookie is replaced.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [accessToken, expiresIn]
                    properties:
                      accessToken:
                        type: string
                        description: Short-lived JWT. Not included as an example value.
                      expiresIn:
                        type: string
                        example: 15m
        "401":
          description: Refresh cookie missing, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /auth/logout:
    post:
      summary: Staff logout
      parameters:
        - in: cookie
          name: chip_refresh
          required: false
          schema:
            type: string
          description: HttpOnly refresh cookie. Cleared and revoked when present.
      responses:
        "200":
          description: Session ended and refresh cookie cleared
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      loggedOut:
                        type: boolean
                        example: true
  /auth/me:
    get:
      summary: Current staff session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff profile from the access token
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SessionData"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /abha/enrolment/otp:
    post:
      summary: Start ABHA enrolment by Aadhaar OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentOtpRequest"
      responses:
        "201":
          description: OTP requested; transaction accepted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      transactionId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: ACCEPTED
                      message:
                        type: string
                        nullable: true
                        description: Masked delivery phrase from the OTP response.
                      otpExpiresAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: OTP remains valid until this time, 10 minutes after it was sent.
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: FORBIDDEN
                message: Patient is outside your facility
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /abha/enrolment/verify:
    post:
      summary: Verify Aadhaar OTP and enrol ABHA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentVerifyRequest"
      responses:
        "200":
          description: Enrolment verified
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      abhaNumberMasked:
                        type: string
                      isNew:
                        type: boolean
                      needsMobileVerify:
                        type: boolean
                      otpExpiresAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: Present when a communication-mobile OTP was sent. That OTP is valid for 10 minutes.
                      abhaNumber:
                        type: string
                        description: 14-digit ABHA number for the enrolment result screen. Not written to the audit log.
                      message:
                        type: string
                        nullable: true
                      profile:
                        type: object
                        properties:
                          abhaNumber:
                            type: string
                          name:
                            type: string
                            nullable: true
                          dateOfBirth:
                            type: string
                            nullable: true
                          gender:
                            type: string
                            nullable: true
                          mobile:
                            type: string
                            nullable: true
                          address:
                            type: string
                            nullable: true
        "400":
          description: Invalid OTP or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: ABHA_OTP_INVALID
                message: The OTP could not be verified
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/mobile/verify:
    post:
      summary: Verify communication mobile OTP after enrolment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileVerifyRequest"
      responses:
        "200":
          description: Mobile verified
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ACCEPTED
        "400":
          description: Invalid mobile OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/{transactionId}/address-suggestions:
    get:
      summary: Suggested ABHA addresses for the enrolment transaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/address:
    post:
      summary: Create an ABHA address for the enrolment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "200":
          description: Address created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      abhaNumberMasked:
                        type: string
                      abhaAddress:
                        type: string
        "400":
          description: Address create failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ABHA address is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: ABHA_ADDRESS_EXISTS
                message: ABHA address already exists.
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/{transactionId}/card:
    get:
      summary: Fetch ABHA card image for display only
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Card image as base64
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      contentType:
                        type: string
                      imageBase64:
                        type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /patients:
    get:
      summary: List patients for the staff facility
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional name search
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of facility-scoped patients
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PatientView"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Register a mother, child, or general patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Patient registered
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/PatientView"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An existing patient matches name, gender, date of birth, and mobile last 4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_MATCH
                message: An existing patient matches this name, gender, date of birth, and mobile.
  /patients/{id}:
    get:
      summary: Patient profile summary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient profile with managing staff and ABHA status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/PatientView"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: FORBIDDEN
                message: Patient is outside your facility
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /patients/{id}/abha:
    get:
      summary: Masked ABHA identity for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Masked ABHA view
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/AbhaIdentityView"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /abha/traces:
    get:
      summary: Recent ABHA request and response traces
      description: Available when ABDM_TRACE is on, and by default in development. Bodies are redacted. Results are paged, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of ABHA calls, newest first
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AbdmTraceEntry"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
        "404":
          description: Tracing is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: TRACE_DISABLED
                message: ABHA traffic tracing is off
  /audit:
    get:
      summary: Facility activity log
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, denied, failure]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of facility-scoped audit entries with human-readable messages
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLogEntry"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
