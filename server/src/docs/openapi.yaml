openapi: 3.0.3
info:
  title: WombTo18 CHIP API
  version: 0.1.0
  description: |
    Routes that exist on this server. Planned mother, child, and ABDM routes are not listed until they are implemented.
    Express paths do not include an /api prefix. The Vite dev server strips /api before proxying.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: staff@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Staff password. Not shown in examples.
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT. Not included as an example value.
        expiresIn:
          type: string
          example: 15m
        user:
          $ref: "#/components/schemas/StaffUser"
      description: The refresh token is set only as the httpOnly cookie chip_refresh. It is not a response field.
    SessionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        accessTtl:
          type: string
          example: 15m
    EnrolmentOtpRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        aadhaar:
          type: string
          description: 12-digit Aadhaar for the first send. Never logged or stored.
          example: "000000000000"
        consentAccepted:
          type: boolean
          enum: [true]
          description: Required on the first send, after the consent screen.
        resend:
          type: boolean
          description: True when resending an OTP for an existing transaction.
        transactionId:
          type: string
          format: uuid
          description: Required when resend is true.
        channel:
          type: string
          enum: [aadhaar, mobile]
          description: Required when resend is true.
    EnrolmentVerifyRequest:
      type: object
      required: [transactionId, otp, mobile, consentAccepted]
      properties:
        transactionId:
          type: string
          format: uuid
        otp:
          type: string
          description: Six-digit OTP. Never logged or stored.
          example: "000000"
        mobile:
          type: string
          description: Required 10-digit communication mobile. Sent with enrolment and shown on the result.
        consentAccepted:
          type: boolean
          enum: [true]
    MobileVerifyRequest:
      type: object
      required: [transactionId, otp]
      properties:
        transactionId:
          type: string
          format: uuid
        otp:
          type: string
    CreateAddressRequest:
      type: object
      required: [transactionId, abhaAddress]
      properties:
        transactionId:
          type: string
          format: uuid
        abhaAddress:
          type: string
          example: demo.mother@sbx
        useExisting:
          type: boolean
          description: Keep an address ABDM already holds, without another create call.
    AbhaIdentityView:
      type: object
      properties:
        verificationStatus:
          type: string
        abhaNumberMasked:
          type: string
          nullable: true
          example: "**-****-****-1234"
        abhaAddress:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    ManagedByStaff:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
    CreatePatientRequest:
      type: object
      required: [patientType, name, gender]
      properties:
        patientType:
          type: string
          enum: [MOTHER, CHILD, GENERAL]
        name:
          type: string
          example: Asha Devi
        gender:
          type: string
          enum: [M, F, O]
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Required when patientType is CHILD. Child must be under 18 years old.
        mobile:
          type: string
          description: Optional 10-digit mobile. Only last 4 digits are stored.
          example: "9876543210"
        forceNew:
          type: boolean
          description: Register a new patient even when name, gender, date of birth, and mobile last 4 match an existing record.
    PatientView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientType:
          type: string
          enum: [MOTHER, CHILD, GENERAL]
        name:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        mobileLast4:
          type: string
          nullable: true
        facilityId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        managedBy:
          $ref: "#/components/schemas/ManagedByStaff"
        abha:
          $ref: "#/components/schemas/AbhaIdentityView"
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: patient.create
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          nullable: true
        facilityId:
          type: string
          format: uuid
          nullable: true
        outcome:
          type: string
          enum: [success, denied, failure]
        message:
          type: string
          example: Registered CHILD patient Ravi Kumar (managed by Demo Staff).
        correlationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ManagedByStaff"
    AbdmTraceEntry:
      type: object
      description: Development trace of one ABHA call. Aadhaar, OTP, tokens, and login identifiers are replaced with [REDACTED].
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          example: POST
        path:
          type: string
          example: /abha/api/v3/enrollment/request/otp
        requestId:
          type: string
        status:
          type: integer
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        requestBody:
          nullable: true
        responseBody:
          nullable: true
        message:
          type: string
          nullable: true
          description: Short text taken from the redacted response, such as an error message or the bridge URL and services.
          example: Invalid LoginId
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Database liveness check
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                required: [success, message, database]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: OK
                  database:
                    type: string
                    example: up
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: DATABASE_UNAVAILABLE
                message: Database is unreachable
  /auth/login:
    post:
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token, staff profile, and an httpOnly refresh cookie
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/LoginData"
        "400":
          description: Email or password failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "body.email: Invalid email"
        "401":
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Invalid email or password
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: RATE_LIMITED
                message: Too many attempts. Try again later.
  /auth/refresh:
    post:
      summary: Issue a new staff access token
      parameters:
        - in: cookie
          name: chip_refresh
          required: true
          schema:
            type: string
          description: HttpOnly refresh cookie from login. The value is never returned in JSON.
      responses:
        "200":
          description: New access token. The refresh cookie is replaced.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [accessToken, expiresIn]
                    properties:
                      accessToken:
                        type: string
                        description: Short-lived JWT. Not included as an example value.
                      expiresIn:
                        type: string
                        example: 15m
        "401":
          description: Refresh cookie missing, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /auth/logout:
    post:
      summary: Staff logout
      parameters:
        - in: cookie
          name: chip_refresh
          required: false
          schema:
            type: string
          description: HttpOnly refresh cookie. Cleared and revoked when present.
      responses:
        "200":
          description: Session ended and refresh cookie cleared
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      loggedOut:
                        type: boolean
                        example: true
  /auth/me:
    get:
      summary: Current staff session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff profile from the access token
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SessionData"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /abha/enrolment/otp:
    post:
      summary: Start ABHA enrolment by Aadhaar OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentOtpRequest"
      responses:
        "201":
          description: OTP requested; transaction accepted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      transactionId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: ACCEPTED
                      message:
                        type: string
                        nullable: true
                        description: Masked delivery phrase from the OTP response.
                      otpExpiresAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: OTP remains valid until this time, 10 minutes after it was sent.
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: FORBIDDEN
                message: Patient is outside your facility
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /abha/enrolment/verify:
    post:
      summary: Verify Aadhaar OTP and enrol ABHA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentVerifyRequest"
      responses:
        "200":
          description: Enrolment verified
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      abhaNumberMasked:
                        type: string
                      isNew:
                        type: boolean
                      needsMobileVerify:
                        type: boolean
                      otpExpiresAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: Present when a communication-mobile OTP was sent. That OTP is valid for 10 minutes.
                      abhaNumber:
                        type: string
                        description: 14-digit ABHA number for the enrolment result screen. Not written to the audit log.
                      message:
                        type: string
                        nullable: true
                      profile:
                        type: object
                        properties:
                          abhaNumber:
                            type: string
                          name:
                            type: string
                            nullable: true
                          dateOfBirth:
                            type: string
                            nullable: true
                          gender:
                            type: string
                            nullable: true
                          mobile:
                            type: string
                            nullable: true
                          address:
                            type: string
                            nullable: true
        "400":
          description: Invalid OTP or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: ABHA_OTP_INVALID
                message: The OTP could not be verified
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/mobile/verify:
    post:
      summary: Verify communication mobile OTP after enrolment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileVerifyRequest"
      responses:
        "200":
          description: Mobile verified
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ACCEPTED
        "400":
          description: Invalid mobile OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/{transactionId}/address-suggestions:
    get:
      summary: Suggested ABHA addresses for the enrolment transaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/address:
    post:
      summary: Create an ABHA address for the enrolment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "200":
          description: Address created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      abhaNumberMasked:
                        type: string
                      abhaAddress:
                        type: string
        "400":
          description: Address create failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ABHA address is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: ABHA_ADDRESS_EXISTS
                message: ABHA address already exists.
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /abha/enrolment/{transactionId}/card:
    get:
      summary: Fetch ABHA card image for display only
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Card image as base64
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      contentType:
                        type: string
                      imageBase64:
                        type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /patients:
    get:
      summary: List patients for the staff facility
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional name search
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of facility-scoped patients
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PatientView"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Register a mother, child, or general patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Patient registered
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/PatientView"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An existing patient matches name, gender, date of birth, and mobile last 4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_MATCH
                message: An existing patient matches this name, gender, date of birth, and mobile.
  /patients/{id}:
    get:
      summary: Patient profile summary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient profile with managing staff and ABHA status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/PatientView"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: FORBIDDEN
                message: Patient is outside your facility
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /patients/{id}/abha:
    get:
      summary: Masked ABHA identity for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Masked ABHA view
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/AbhaIdentityView"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Patient outside facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
  /abha/traces:
    get:
      summary: Recent ABHA request and response traces
      description: Available when ABDM_TRACE is on, and by default in development. Bodies are redacted. Results are paged, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of ABHA calls, newest first
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AbdmTraceEntry"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
        "404":
          description: Tracing is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: TRACE_DISABLED
                message: ABHA traffic tracing is off
  /audit:
    get:
      summary: Facility activity log
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, denied, failure]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of facility-scoped audit entries with human-readable messages
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLogEntry"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /hip/readiness:
    get:
      summary: HIP bridge readiness
      security:
        - bearerAuth: []
      responses:
        "200":
          description: HIP id, the configured callback base, and the bridge-services summary. callbackBase is the public URL the Register callback URL action will send.
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: UNAUTHENTICATED
                message: Authentication required
  /hip/care-contexts/{id}/retry:
    post:
      summary: Retry the link of a failed care context
      description: >
        Only a care context whose link FAILED can be retried. It is refused when ABDM said the
        care context is already linked (409 ALREADY_LINKED), when the ABHA is not verified, or when
        the record has no valid bundle. The response carries ABDM's own code and message, and a hint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The link was sent again, or failed again with the reason in link.code and link.message
        "400":
          description: The patient has no date of birth
        "401":
          description: Authentication required
        "404":
          description: Care context not found in this facility
        "409":
          description: Not retryable (NOT_RETRYABLE, ALREADY_LINKED, ABHA_NOT_VERIFIED, RECORD_NOT_LINKABLE)
  /hip/patients/{id}/records:
    get:
      summary: Care contexts for one patient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Visit counts and one page of care contexts
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Patient was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
    post:
      summary: Save a visit and start linking when the bundle is valid
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hiType, occurredAt, code, codeDisplay]
              properties:
                hiType:
                  type: string
                  example: ImmunizationRecord
                occurredAt:
                  type: string
                  example: "2026-03-01T10:00:00.000Z"
                code:
                  type: string
                  example: "111164008"
                codeDisplay:
                  type: string
                  example: Poliomyelitis vaccine
      responses:
        "201":
          description: Record stored
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: code is required
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hip/bundles/inspect:
    post:
      summary: Validate a FHIR bundle without storing it
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bundle summary without the bundle body
        "400":
          description: Invalid bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hip/exchanges:
    get:
      summary: M2 calls and callbacks grouped by request id
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of the exchange timeline. Header values are not included.
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hip/bridge/url:
    post:
      summary: Register ABDM_CALLBACK_BASE_URL on the bridge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  enum: [true]
      responses:
        "200":
          description: Bridge URL accepted
        "400":
          description: Confirmation missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: BRIDGE_URL_UNCONFIRMED
                message: Confirm the current callback base before it is registered
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hiu/options:
    get:
      summary: Purposes, HI types and access modes from the M3 specification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enumerations for the consent request form. claimedHiTypes is what this HIU runs in its functional test.
  /hiu/readiness:
    get:
      summary: HIU readiness (HIU service id, callback base, data push URL, crypto)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: blockers lists what would make an M3 call fail before it is sent.
  /hiu/consent-requests:
    get:
      summary: Consent requests raised by this facility (HIU_FLOW_104)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema:
            type: string
            enum: [INIT_SENT, INIT_FAILED, REQUESTED, GRANTED, DENIED, EXPIRED, REVOKED]
      responses:
        "200":
          description: Paged list with patient name, ABHA address, masked ABHA number, HI types, purpose, range, expiry, status and the time of each status change.
    post:
      summary: Raise a consent request (POST /api/hiecm/consent/v3/request/init)
      description: CLINICIAN or ADMIN. Send an Idempotency-Key header to make a retry safe. A refusal from ABDM is stored with the ABDM code and message, and the row is INIT_FAILED.
      security:
        - bearerAuth: []
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, purposeCode, hiTypes, dateFrom, dateTo, dataEraseAt]
              properties:
                patientId: { type: string, format: uuid }
                purposeCode: { type: string, enum: [CAREMGT, BTG, PUBHLTH, HPAYMT, DSRCH, PATRQT] }
                hiTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [DiagnosticReport, DischargeSummary, HealthDocumentRecord, ImmunizationRecord, OPConsultation, Prescription, WellnessRecord, Invoice]
                dateFrom: { type: string, format: date-time }
                dateTo: { type: string, format: date-time, description: Must not be in the future }
                dataEraseAt: { type: string, format: date-time, description: Consent expiry in the future }
                accessMode: { type: string, enum: [VIEW, STORE, STREAM, QUERY], default: VIEW }
      responses:
        "201":
          description: Stored as INIT_SENT, or INIT_FAILED with the ABDM message
        "403":
          description: Role is not CLINICIAN or ADMIN
        "422":
          description: The patient has no ABHA address ending @sbx or @abdm
        "503":
          description: ABDM_HIU_ID is not configured
  /hiu/consent-requests/{id}:
    get:
      summary: One consent request with requested vs granted values, artefacts, transfers and the ABDM timeline
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail
        "404":
          description: Not found
  /hiu/consent-requests/{id}/status:
    post:
      summary: Ask ABDM for the request status (POST /api/hiecm/consent/v3/request/status)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Sent; the answer arrives on on-status
  /hiu/artefacts/{id}/fetch:
    post:
      summary: Fetch a consent artefact (POST /api/hiecm/consent/v3/fetch)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Sent; the artefact arrives on on-fetch
  /hiu/artefacts/{id}/health-information:
    post:
      summary: Request the records under a granted artefact (POST /api/hiecm/data-flow/v3/health-information/request)
      description: Generates a fresh Curve25519 key pair and nonce. The range defaults to, and is clamped inside, the granted range.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dateFrom: { type: string, format: date-time }
                dateTo: { type: string, format: date-time }
      responses:
        "202":
          description: Sent
        "409":
          description: Artefact not granted, revoked, expired or not yet fetched, or no HTTPS data push URL
  /hiu/artefacts/{id}/records:
    get:
      summary: Decrypted records received under one artefact, only for granted HI types
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Records
        "410":
          description: CONSENT_REVOKED or CONSENT_EXPIRED, with the time. Records are purged.
  /hiu/health-information/{id}/status:
    get:
      summary: Data flow status from ABDM (GET /api/hiecm/data-flow/v3/health-information/request/status/{transaction-id})
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The ABDM body, verbatim
  /registries/options:
    get:
      summary: M4 registry options (ownership codes, fixed facility page size)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ownershipCodes and facilityPageSize.
  /registries/readiness:
    get:
      summary: M4 readiness (registry bases, credentials, bridge id, facility roles on bridge-services)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: blockers and warnings. Calls bridge-services when credentials are configured.
  /registries/facility:
    get:
      summary: The signed-in user's own facility, with HFR id, status and observed bridge roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: id, name, hfrId, hfrStatus, hipName, roles.
  /registries/hfr/masters/{kind}:
    get:
      summary: HFR LGD master data (GET /v1.5/facility/lgd/...). kind is states, districts or subdistricts
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [states, districts, subdistricts] } }
        - { name: parentCode, in: query, schema: { type: string }, description: State code for districts or district code for subdistricts }
      responses:
        "200":
          description: items of code and name.
        "400":
          description: parentCode missing for districts or subdistricts.
  /registries/hfr/search:
    post:
      summary: Search the facility registry (POST /FacilityManagement/v1.5/facility/search)
      description: Give facilityId, or facilityName with ownershipCode and stateLGDCode. The page size is fixed at 10 by the server. A 404 or empty list from ABDM is returned as no match.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityId: { type: string, description: 12 characters starting IN }
                facilityName: { type: string }
                ownershipCode: { type: string, enum: [G, P, PP] }
                stateLGDCode: { type: string }
                districtLGDCode: { type: string }
                subDistrictLGDCode: { type: string }
                pincode: { type: string }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: facilities, page, pageSize, totalFacilities, numberOfPages.
        "400":
          description: VALIDATION_ERROR.
        "502":
          description: ABDM_UPSTREAM or REGISTRY_FORBIDDEN.
  /registries/hpr/exists/{hprId}:
    get:
      summary: Does an HPR id exist (GET /v1/search/existsByHprId/{hprId})
      security:
        - bearerAuth: []
      parameters:
        - { name: hprId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: exists. A 404 from ABDM reads as exists false.
  /registries/hpr/{hprId}:
    get:
      summary: Search a professional by HPR id (GET /v1/search/searchByHprId/{hprId})
      security:
        - bearerAuth: []
      parameters:
        - { name: hprId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: found and professional. Nothing is stored.
  /registries/hpr/search-by-mobile:
    post:
      summary: Search professionals by mobile (GET /v1/search/searchByMobile/{mobile}). CLINICIAN or ADMIN
      description: A POST so the number never appears in this server's URLs. It is not written to traces, audit or transactions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { type: string, pattern: "^[0-9]{10}$" }
      responses:
        "200":
          description: professionals.
        "403":
          description: PERMISSION_DENIED for STAFF.
  /registries/hpr/professional-info:
    post:
      summary: Professional information (POST /apis/v1/doctors/fetch-professional-info). CLINICIAN or ADMIN
      description: The shape of practitioners is not documented by ABDM (UNVERIFIED), so it is returned as sent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [practitioner]
              properties:
                practitioner:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    contactNumber: { type: string }
                    state: { type: string }
                    registrationNumber: { type: string }
                    stateCouncilName: { type: string }
      responses:
        "200":
          description: message and practitioners.
  /registries/facilities/{id}/hfr-link:
    post:
      summary: Save the HFR id on the facility after the registry returns exactly that facility. ADMIN, own facility only
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hfrId]
              properties:
                hfrId: { type: string }
      responses:
        "200":
          description: id, name, hfrId, hfrStatus, hfrVerifiedAt.
        "404":
          description: REGISTRY_NOT_FOUND. A facility in Draft is not visible.
  /registries/practitioners/{id}/hpr-link:
    post:
      summary: Save an HPR id on a practitioner of this facility after the registry confirms it. ADMIN
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hprId]
              properties:
                hprId: { type: string }
      responses:
        "200":
          description: id, name, hprId, hprVerifiedAt.
