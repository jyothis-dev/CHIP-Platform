  /registries/facilities/{id}/bridge-status:
    get:
      summary: Live bridge-services narrowed to this facility, with the ids to copy into ABDM_HIP_ID and ABDM_HIU_ID
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: facility, bridge, services, roles, config, suggested, warnings.
  /registries/facilities/{id}/bridge-link:
    post:
      summary: Link the facility to this bridge (POST /v1/bridges/MutipleHRPAddUpdateServices). ADMIN
      description: One HRP entry per role, never one entry for both. Success is reported only when bridge-services lists every requested role afterwards. Needs ABDM_BRIDGE_ID and a saved HFR id.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, hipName, confirm]
              properties:
                roles: { type: array, items: { type: string, enum: [HIP, HIU] }, minItems: 1 }
                hipName: { type: string, maxLength: 15, description: No special characters }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: requestedRoles, confirmedRoles, missingRoles, confirmed, warnings.
        "400":
          description: VALIDATION_ERROR, HIP_NAME_INVALID, HIP_NAME_REFUSED or REGISTRY_VALIDATION.
        "409":
          description: HFR_ID_MISSING.
        "503":
          description: BRIDGE_ID_MISSING.
