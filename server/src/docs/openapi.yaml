                message: Authentication required
  /hip/patients/{id}/records:
    get:
      summary: Care contexts for one patient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Visit counts and one page of care contexts
        "400":
          description: Invalid page or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: "query.page: Too small"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Patient was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PATIENT_NOT_FOUND
                message: Patient not found
    post:
      summary: Save a visit and start linking when the bundle is valid
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hiType, occurredAt, code, codeDisplay]
              properties:
                hiType:
                  type: string
                  example: ImmunizationRecord
                occurredAt:
                  type: string
                  example: "2026-03-01T10:00:00.000Z"
                code:
                  type: string
                  example: "111164008"
                codeDisplay:
                  type: string
                  example: Poliomyelitis vaccine
      responses:
        "201":
          description: Record stored
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: VALIDATION_ERROR
                message: code is required
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
